<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Karne Üretici - FatihHoca_UltraMat.</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
:root{
  --orange:#F97316;
  --purple:#8B5CF6;
  --dark:#3B0764;
  --text:#334155;
  --gray:#64748B;
  --green:#16A34A;
  --red:#DC2626;
  --blue:#2563EB;
}
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif;}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at top left,#FED7AA 0%,transparent 35%),
    linear-gradient(145deg,#FFF7ED,#FFFFFF 55%,#F5F3FF);
  padding:20px;color:var(--text);
}
.wrap{max-width:640px;margin:0 auto;}

.topBar{background:white;border-radius:20px;padding:18px;margin-bottom:20px;box-shadow:0 10px 25px rgba(139,92,246,.12);}
.topBar h2{margin:0 0 12px;color:var(--dark);font-size:17px;}
.topBar input{width:100%;padding:11px 12px;margin-bottom:10px;border-radius:10px;border:1px solid #E2E8F0;font-size:14px;}
.topBar button{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--orange),var(--purple));color:white;font-weight:800;font-size:14px;cursor:pointer;}
.durum{text-align:center;font-size:13px;color:var(--gray);margin-top:8px;}
.uyari{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:10px 12px;font-size:12px;color:#92400E;margin-bottom:14px;}

.ogrenciBlok{margin-bottom:30px;}

/* ============ KARNE (referans görsele sadık) ============ */
.karneCard{
  background:white;border-radius:22px;padding:30px;
  border:1px solid #EDE9FE;box-shadow:0 20px 45px rgba(139,92,246,.14);
}
.khHeader{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:2px solid #F5F3FF;margin-bottom:20px;}
.khBrand{display:flex;align-items:center;gap:14px;}
.khLogo{width:54px;height:54px;flex-shrink:0;}
.khTitle{font-size:27px;font-weight:800;color:var(--dark);line-height:1.1;}
.khTitle span{color:var(--orange);font-style:italic;}
.khSub{font-size:10px;letter-spacing:2.5px;color:#94A3B8;font-weight:700;margin-top:2px;}
.khDate{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--dark);}

.khInfoBox{border:1px solid #F1E9FE;border-radius:16px;padding:16px 18px;margin-bottom:18px;display:flex;}
.khInfoItem{flex:1;display:flex;align-items:center;gap:10px;}
.khInfoItem+.khInfoItem{padding-left:16px;margin-left:6px;}
.khInfoIcon{width:30px;height:30px;flex-shrink:0;}
.khInfoLabel{font-size:10px;letter-spacing:1px;color:#94A3B8;font-weight:700;}
.khInfoValue{font-size:14px;font-weight:800;color:var(--dark);line-height:1.25;margin-top:2px;}

.khStatsBox{border:1px solid #F1E9FE;border-radius:18px;padding:18px;display:flex;margin-bottom:16px;}
.khStat{flex:1;text-align:center;}
.khStatLabel{font-size:11px;letter-spacing:1px;color:#94A3B8;font-weight:800;}
.khStatValue{font-size:38px;font-weight:900;margin-top:6px;}
.khUnderline{width:34px;height:3px;border-radius:3px;margin:6px auto 0;}
.khSiraSub{font-size:11px;color:var(--purple);font-weight:800;margin-top:4px;}
.khBadge{display:inline-flex;align-items:center;gap:6px;background:#ECFDF5;color:var(--green);font-weight:800;font-size:12px;padding:7px 12px;border-radius:20px;margin-top:8px;}

.khBottomRow{border:1px solid #F1E9FE;border-radius:18px;padding:16px 18px;display:flex;gap:18px;margin-bottom:22px;}
.khDYB{display:flex;flex-direction:row;gap:16px;flex-shrink:0;align-items:center;}
.khDYBItem{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap;}
.khDivider{width:1px;background:#F1E9FE;}
.khCompare{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.khCompareTitle{font-size:11px;letter-spacing:1px;color:#94A3B8;font-weight:800;margin-bottom:2px;}
.khCompareRow{display:flex;align-items:center;gap:8px;}
.khCompareLabel{font-size:12px;font-weight:700;color:var(--gray);width:56px;flex-shrink:0;}
.khBarBg{flex:1;height:9px;background:#E2E8F0;border-radius:6px;overflow:hidden;}
.khBarFill{height:100%;border-radius:6px;}
.khCompareVal{font-size:12px;font-weight:800;width:44px;text-align:right;flex-shrink:0;}

.khSectionTitle{font-weight:900;color:var(--dark);font-size:15px;margin:22px 0 0;display:flex;align-items:center;gap:8px;}
.khSectionUnderline{width:100%;height:2px;background:#EDE4FE;margin:10px 0 14px;}
.khColHeader{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:1px;color:#94A3B8;font-weight:800;margin-bottom:10px;}

.konuRow{margin-bottom:14px;display:flex;align-items:center;gap:12px;}
.konuIcon{width:34px;height:34px;border-radius:50%;color:white;font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.konuBody{flex:1;}
.konuTop{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:5px;}
.konuBarBg{width:100%;height:8px;background:#E2E8F0;border-radius:6px;overflow:hidden;}
.konuBarFill{height:100%;border-radius:6px;}

.khQuote{background:#F8F5FF;border-radius:18px;padding:18px 20px;display:flex;gap:16px;align-items:flex-start;margin:20px 0;}
.khQuoteMark{font-size:34px;color:var(--purple);font-weight:900;line-height:1;flex-shrink:0;}
.khQuoteBody{flex:1;}
.khQuoteTitle{font-weight:900;color:var(--dark);font-size:12.5px;letter-spacing:.5px;margin-bottom:6px;}
.khQuoteText{font-size:13px;line-height:1.55;color:var(--text);}
.khSign{text-align:right;flex-shrink:0;border-left:1px solid #E9E1FB;padding-left:18px;}
.khSignName{font-family:'Segoe Script','Bradley Hand','Brush Script MT',cursive;font-size:30px;color:var(--purple);text-decoration:underline;text-decoration-color:#C4B5FD;text-underline-offset:4px;}
.khSignRole{font-size:10.5px;color:var(--gray);font-weight:700;margin-top:4px;}

.planRow{display:flex;gap:12px;flex-wrap:wrap;}
.planCard{flex:1;min-width:140px;background:#FFFBF5;border:1px solid #FED7AA;border-radius:16px;padding:14px;}
.planIcon{width:30px;height:30px;border-radius:50%;color:white;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;}
.planTitle{font-weight:900;color:var(--dark);font-size:11.5px;letter-spacing:.3px;margin-bottom:6px;}
.planCard ul{margin:0;padding-left:16px;font-size:11.5px;color:var(--text);line-height:1.5;}
.planFooter{text-align:center;font-size:11.5px;color:var(--gray);margin-top:16px;font-style:italic;}

.khFooter{display:flex;align-items:center;gap:16px;border-top:2px solid #F5F3FF;margin-top:22px;padding-top:18px;}
.khQr{width:64px;height:64px;border-radius:8px;flex-shrink:0;}
.khFooterText{font-size:11px;color:var(--gray);line-height:1.4;flex:1;}
.khFooterText b{color:var(--dark);}
.khFooterQuote{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:4px;text-align:right;font-size:13px;color:var(--dark);font-weight:700;font-style:italic;}
.khFooterQuote .qMark{font-size:32px;color:#DDD6FE;font-weight:900;font-style:normal;line-height:0;flex-shrink:0;}
.khFooterQuote b{color:var(--purple);text-decoration:underline;text-decoration-color:var(--purple);text-underline-offset:3px;font-style:italic;}

.aksiyonlar{display:flex;gap:10px;margin-top:14px;}
.aksiyonlar button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;}
.btnPng{background:var(--dark);color:white;}
.btnWa{background:#25D366;color:white;}
.btnWa:disabled{background:#CBD5E1;cursor:not-allowed;}
.telefonYok{font-size:11px;color:#DC2626;margin-top:6px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topBar">
    <h2>📇 Karne Görseli Üretici</h2>
    <div class="uyari">Bu sayfa sadece senin kullanman içindir, linkini velilerle paylaşma (veli telefon numaralarını gösteriyor).</div>
    <input type="text" id="sinavIdInput" placeholder="Sınav ID (örn: D801)">
    <input type="password" id="anahtarInput" placeholder="Gizli Anahtar">
    <button onclick="listeGetir()">Karneleri Getir</button>
    <div class="durum" id="durum"></div>
  </div>

  <div id="liste"></div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxh0Rv69xsEA_xdYPFbuCcR7MfRYQ4keE301jHR69iVYEpDgxZ3h1Ep0ZuqdEZqRfW74A/exec";
const FRONTEND_URL = "https://SENIN-SITEN.com/index.html"; // öğrenci sonuç ekranının linki (QR ve alt not için)

const notHavuzu = {
  yuksek: [
    "Zirveye göz kırpan harika bir çıkış yakaladın, tebrik ederim.",
    "Bu performansı korursan seni büyük başarılar bekliyor, aferin.",
    "Gerçekten güçlü bir sınavdı, bu tempoyu sürdürelim."
  ],
  orta: [
    "İyi bir temel var, birkaç eksiği kapatınca çok daha yükseleceksin.",
    "Emeğin belli oluyor, zayıf konulara biraz daha zaman ayıralım.",
    "Doğru yoldasın, düzenli tekrar ile net artışı kısa sürede gelir."
  ],
  dusuk: [
    "Bu sınav bir başlangıç noktası, birlikte eksikleri kapatacağız.",
    "Şu an odaklanman gereken net bir konu haritamız var, pes etme.",
    "Küçük adımlarla ilerleyelim, temelleri sağlamlaştırınca ivme kazanacaksın."
  ]
};

function notSec(puan){
  let havuz = puan>=70 ? notHavuzu.yuksek : (puan>=45 ? notHavuzu.orta : notHavuzu.dusuk);
  return havuz[Math.floor(Math.random()*havuz.length)];
}

function bugununTarihi(){
  let d = new Date();
  let g = String(d.getDate()).padStart(2,'0');
  let a = String(d.getMonth()+1).padStart(2,'0');
  return `${g}.${a}.${d.getFullYear()}`;
}

function normalizeTelefon(telefon){
  let t = String(telefon||"").replace(/[^0-9]/g,"");
  if(t.indexOf("0")===0) t = "90"+t.substring(1);
  if(t.indexOf("90")!==0) t = "90"+t;
  return t;
}

function performansRengi(yuzde){
  if(yuzde>=80) return "#16A34A";
  if(yuzde>=50) return "#2563EB";
  return "#DC2626";
}

function konuIkon(konu){
  konu = (konu||"").toLowerCase();
  if(konu.includes("üslü")) return "aⁿ";
  if(konu.includes("karekök")) return "√x";
  if(konu.includes("çarpan")) return "123";
  if(konu.includes("cebir")) return "x+y";
  if(konu.includes("olasılık")) return "%";
  if(konu.includes("doğrusal")) return "y=x";
  if(konu.includes("üçgen")) return "△";
  if(konu.includes("dönüşüm")) return "⟳";
  if(konu.includes("cisim")) return "⬡";
  if(konu.includes("eşitsizlik")) return "≠";
  if(konu.includes("eğim")) return "∕";
  if(konu.includes("geometri")) return "📐";
  return "Σ";
}

const LOGO_SVG_RAW =
'<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="54" height="54">'+
  '<circle cx="50" cy="50" r="44" fill="none" stroke="#F97316" stroke-width="5"/>'+
  '<path d="M32 68 L50 28 L68 68 Z" fill="none" stroke="#3B0764" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>'+
  '<circle cx="50" cy="28" r="5" fill="#8B5CF6"/>'+
'</svg>';
const LOGO_SVG = '<img src="data:image/svg+xml,' + encodeURIComponent(LOGO_SVG_RAW) + '" width="54" height="54">';


const CAL_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#8B5CF6" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><line x1="3" y1="10" x2="21" y2="10"/><line x1="8" y1="3" x2="8" y2="7"/><line x1="16" y1="3" x2="16" y2="7"/></svg>`;
const PERSON_SVG = `<svg viewBox="0 0 24 24" width="30" height="30" fill="#8B5CF6"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4.4 3.6-8 8-8s8 3.6 8 8"/></svg>`;
const SCHOOL_SVG = `<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V10l7-5 7 5v11"/><line x1="12" y1="3" x2="12" y2="5.5"/><circle cx="12" cy="2.3" r="1" fill="#8B5CF6" stroke="none"/><line x1="9" y1="14" x2="9" y2="21"/><line x1="15" y1="14" x2="15" y2="21"/><line x1="3" y1="21" x2="21" y2="21"/></svg>`;
const CLIP_SVG = `<svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#8B5CF6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="18" rx="2"/><rect x="9" y="2" width="6" height="4" rx="1" fill="#8B5CF6" stroke="none"/><line x1="8" y1="11" x2="16" y2="11"/><line x1="8" y1="15" x2="16" y2="15"/><line x1="8" y1="19" x2="13" y2="19"/></svg>`;
const CHECK_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#16A34A" stroke-width="3"><circle cx="12" cy="12" r="10" stroke="#16A34A"/><path d="M7 12l3 3 7-7"/></svg>`;
const X_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#DC2626" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M8 8l8 8M16 8l-8 8"/></svg>`;
const CIRCLE_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#64748B" stroke-width="3"><circle cx="12" cy="12" r="10"/></svg>`;
const BOOK_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#3B0764" stroke-width="2"><path d="M4 5c2-1 5-1 8 0v14c-3-1-6-1-8 0V5z"/><path d="M20 5c-2-1-5-1-8 0v14c3-1 6-1 8 0V5z"/></svg>`;
const TARGET_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#3B0764" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.3" fill="#3B0764"/></svg>`;
const BAR_SVG = `<svg viewBox="0 0 24 24" width="18" height="18" fill="#8B5CF6"><rect x="3" y="14" width="4" height="7" rx="1"/><rect x="10" y="9" width="4" height="12" rx="1"/><rect x="17" y="4" width="4" height="17" rx="1"/></svg>`;
const CLOCK_SVG = `<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>`;

async function listeGetir(){
  let sinavID = document.getElementById("sinavIdInput").value.trim();
  let anahtar = document.getElementById("anahtarInput").value.trim();
  let durum = document.getElementById("durum");
  let listeEl = document.getElementById("liste");
  listeEl.innerHTML = "";

  if(!sinavID || !anahtar){ durum.innerHTML = "Sınav ID ve Anahtar gerekli."; return; }
  durum.innerHTML = "Yükleniyor...";

  try{
    let url = `${API_URL}?sinavID=${encodeURIComponent(sinavID)}&liste=true&anahtar=${encodeURIComponent(anahtar)}`;
    let res = await fetch(url);
    let data = await res.json();

    if(data && data.hata){ durum.innerHTML = "❌ Anahtar hatalı."; return; }
    if(!data || data.length===0){ durum.innerHTML = "Bu Sınav ID'ye ait sonuç bulunamadı."; return; }

    durum.innerHTML = `${data.length} öğrenci bulundu.`;
    data.forEach((ogrenci, idx) => olustur(ogrenci, idx));

  }catch(err){ durum.innerHTML = "Hata: " + err; }
}

function olustur(o, idx){
  let listeEl = document.getElementById("liste");
  let blok = document.createElement("div");
  blok.className = "ogrenciBlok";
  let cardId = "karne_" + idx;

  let toplamSoru = (Number(o.dogru)||0)+(Number(o.yanlis)||0)+(Number(o.bos)||0);
  let olcek = Math.max(toplamSoru, Number(o.net)||0, Number(o.sinifOrtalama)||0, 1);
  let senNet = Number(o.net)||0;
  let ortNet = Number(o.sinifOrtalama)||0;
  let puanSayi = Number(o.puan)||0;
  let ilkYuzde = (o.sira && o.katilim) ? Math.max(1, Math.round((o.sira/o.katilim)*100)) : null;

  let konularHtml = "";
  (o.konular||[]).forEach(k=>{
    let renk = performansRengi(k.yuzde);
    konularHtml += `
      <div class="konuRow">
        <div class="konuIcon" style="background:${renk}">${konuIkon(k.konu)}</div>
        <div class="konuBody">
          <div class="konuTop"><span>${k.konu}</span><span style="color:${renk}">%${k.yuzde}</span></div>
          <div class="konuBarBg"><div class="konuBarFill" style="width:${k.yuzde}%;background:${renk}"></div></div>
        </div>
      </div>`;
  });

  let zayifKonular = (o.konular||[]).filter(k=>k.yuzde<70).sort((a,b)=>a.yuzde-b.yuzde).slice(0,2);
  let planHtml = "";
  zayifKonular.forEach(k=>{
    let renk = performansRengi(k.yuzde);
    planHtml += `
      <div class="planCard">
        <div class="planIcon" style="background:${renk}">${konuIkon(k.konu)}</div>
        <div class="planTitle">${k.konu.toUpperCase()}</div>
        <ul><li>40 soru çözümü</li><li>Konu tekrar videoları</li></ul>
      </div>`;
  });
  planHtml += `
    <div class="planCard">
      <div class="planIcon" style="background:var(--purple)">${CLOCK_SVG}</div>
      <div class="planTitle">SÜRE ÇALIŞMASI</div>
      <ul><li>1 deneme çözümü</li><li>Süre analizi</li></ul>
    </div>`;

  let not = notSec(puanSayi);
  let kisiselLink = FRONTEND_URL + "?isim=" + encodeURIComponent(o.isim) + "&kod=" + encodeURIComponent(o.kod);
  let qrUrl = "https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=" + encodeURIComponent(kisiselLink);

  blok.innerHTML = `
    <div class="karneCard" id="${cardId}">

      <div class="khHeader">
        <div class="khBrand">
          <div class="khLogo">${LOGO_SVG}</div>
          <div>
            <div class="khTitle">FatihHoca_<span>UltraMat.</span></div>
            <div class="khSub">MATEMATİK DERSİ ANALİZİ</div>
          </div>
        </div>
        <div class="khDate">${CAL_SVG} ${bugununTarihi()}</div>
      </div>

      <div class="khInfoBox">
        <div class="khInfoItem">
          <div class="khInfoIcon">${PERSON_SVG}</div>
          <div><div class="khInfoLabel">ÖĞRENCİ</div><div class="khInfoValue">${o.isim}</div></div>
        </div>
        <div class="khInfoItem">
          <div class="khInfoIcon">${SCHOOL_SVG}</div>
          <div><div class="khInfoLabel">SINIF</div><div class="khInfoValue">${o.sinif}. Sınıf<br>${o.sube} Şubesi</div></div>
        </div>
        <div class="khInfoItem">
          <div class="khInfoIcon">${CLIP_SVG}</div>
          <div><div class="khInfoLabel">SINAV</div><div class="khInfoValue">${o.sinav}</div></div>
        </div>
      </div>

      <div class="khStatsBox">
        <div class="khStat">
          <div class="khStatLabel">NET</div>
          <div class="khStatValue" style="color:var(--orange)">${o.net}</div>
          <div class="khUnderline" style="background:var(--orange)"></div>
        </div>
        <div class="khStat">
          <div class="khStatLabel">PUAN</div>
          <div class="khStatValue" style="color:var(--purple)">${o.puan!==undefined&&o.puan!==""?o.puan:"-"}</div>
          <div class="khUnderline" style="background:var(--purple)"></div>
        </div>
        <div class="khStat">
          <div class="khStatLabel">SIRALAMA</div>
          <div class="khStatValue" style="font-size:22px;color:var(--purple);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;">${BAR_SVG} ${o.sira?(o.sira+". / "+(o.katilim||"-")):"-"}</div>
          ${ilkYuzde ? `<div class="khSiraSub">İlk %${ilkYuzde}</div>` : ""}
        </div>
        <div class="khStat">
          <div class="khStatLabel">GENEL BAŞARI</div>
          <div class="khBadge">✓ ${o.basari||"-"}</div>
        </div>
      </div>

      <div class="khBottomRow">
        <div class="khDYB">
          <div class="khDYBItem">${CHECK_SVG} ${o.dogru} DOĞRU</div>
          <div class="khDYBItem">${X_SVG} ${o.yanlis} YANLIŞ</div>
          <div class="khDYBItem">${CIRCLE_SVG} ${o.bos} BOŞ</div>
        </div>
        <div class="khDivider"></div>
        <div class="khCompare">
          <div class="khCompareTitle">NET KARŞILAŞTIRMASI</div>
          <div class="khCompareRow">
            <div class="khCompareLabel">Sen</div>
            <div class="khBarBg"><div class="khBarFill" style="width:${Math.min(100,(senNet/olcek)*100)}%;background:linear-gradient(90deg,var(--orange),var(--purple))"></div></div>
            <div class="khCompareVal" style="color:var(--orange)">${senNet.toFixed(2)}</div>
          </div>
          <div class="khCompareRow">
            <div class="khCompareLabel">Sınıf Ort.</div>
            <div class="khBarBg"><div class="khBarFill" style="width:${Math.min(100,(ortNet/olcek)*100)}%;background:#94A3B8"></div></div>
            <div class="khCompareVal" style="color:var(--gray)">${o.sinifOrtalama!==null&&o.sinifOrtalama!==undefined?ortNet.toFixed(2):"-"}</div>
          </div>
        </div>
      </div>

      <div class="khSectionTitle">${BOOK_SVG} KONU ANALİZİ &amp; EKSİK TAKİBİ</div>
      <div class="khSectionUnderline"></div>
      <div class="khColHeader"><span>KONU</span><span>BAŞARI ORANI</span></div>
      ${konularHtml || "<div style='font-size:12px;color:#94A3B8;'>Konu analizi bulunamadı.</div>"}

      <div class="khQuote">
        <div class="khQuoteMark">&ldquo;</div>
        <div class="khQuoteBody">
          <div class="khQuoteTitle">FATİH HOCA'NIN NOTU</div>
          <div class="khQuoteText">${not}</div>
        </div>
        <div class="khSign">
          <div class="khSignName">Fatih Hoca</div>
          <div class="khSignRole">Matematik Öğretmeni</div>
        </div>
      </div>

      <div class="khSectionTitle">${TARGET_SVG} ÖNERİLEN ÇALIŞMA PLANI</div>
      <div class="khSectionUnderline"></div>
      <div class="planRow">${planHtml}</div>
      <div class="planFooter">Düzenli tekrar ve planlı çalışma ile bir sonraki sınavda daha da ileriye gideceksin!</div>

      <div class="khFooter">
        <img class="khQr" src="${qrUrl}" crossorigin="anonymous">
        <div class="khFooterText"><b>DETAYLI SONUÇLAR</b><br>Yanlış yaptığın sorular, doğru cevaplar ve detaylı konu analizleri için QR kodu okut.</div>
        <div class="khFooterQuote"><span class="qMark">&ldquo;</span>Nerede olduğunu gör,<br>nereye ulaşacağını <b>planla.</b><span class="qMark">&rdquo;</span></div>
      </div>

    </div>

    <div class="aksiyonlar">
      <button class="btnPng" onclick="pngIndir('${cardId}','${o.isim.replace(/'/g,"")}')">🖼️ PNG İndir</button>
      <button class="btnWa" id="wa_${idx}" onclick="waAc(${idx})">📲 WhatsApp Aç</button>
    </div>
    ${!o.veliTelefon ? `<div class="telefonYok">⚠️ Bu öğrencinin veli telefonu Ogrenciler sayfasında eksik.</div>` : ""}
  `;

  listeEl.appendChild(blok);

  let waBtn = document.getElementById("wa_"+idx);
  if(!o.veliTelefon){
    waBtn.disabled = true;
  } else {
    waBtn.onclick = function(){
      let telefon = normalizeTelefon(o.veliTelefon);
      let mesaj = `Sayın Veli, ${o.isim} adlı öğrencimizin sınav karnesi ektedir. 📎\n(PNG İndir butonuyla indirdiğin görseli bu sohbete sürükleyip gönder.)`;
      window.open(`https://wa.me/${telefon}?text=${encodeURIComponent(mesaj)}`, "_blank");
    };
  }
}

async function pngIndir(cardId, isim){
  let el = document.getElementById(cardId);
  html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true}).then(canvas=>{
    let link = document.createElement("a");
    link.download = isim.trim().replace(/\s+/g,"_") + "_karne.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
  });
}
</script>
</body>
</html>
