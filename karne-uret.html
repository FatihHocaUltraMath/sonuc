<style>
:root{
  --orange:#F97316;
  --purple:#8B5CF6;
  --dark:#3B0764;
  --text:#334155;
  --gray:#64748B;
  --green:#16A34A;
  --red:#DC2626;
  --blue:#2563EB;
}
*{box-sizing:border-box;font-family:"Segoe UI",Arial,sans-serif;}
body{
  margin:0;min-height:100vh;
  background:
    radial-gradient(circle at top left,#FED7AA 0%,transparent 35%),
    linear-gradient(145deg,#FFF7ED,#FFFFFF 55%,#F5F3FF);
  padding:20px;color:var(--text);
}
.wrap{max-width:640px;margin:0 auto;}
.surumBilgi{text-align:center;font-size:10.5px;color:#CBD5E1;margin-top:24px;}

/* Masaüstünde bu araç genelde bilgisayardan kullanılacağı için (öğretmen paneli),
   geniş ekranlarda daha ferah bir genişliğe izin veriyoruz. Mobilde değişiklik yok. */
@media (min-width:1000px){
  .wrap{ max-width:860px; }
  body{ padding:32px 28px; }
}

.topBar{background:white;border-radius:20px;padding:18px;margin-bottom:20px;box-shadow:0 10px 25px rgba(139,92,246,.12);}
.topBar h2{margin:0 0 12px;color:var(--dark);font-size:17px;}
.topBar input{width:100%;padding:11px 12px;margin-bottom:10px;border-radius:10px;border:1px solid #E2E8F0;font-size:14px;}
.topBar button{width:100%;padding:12px;border:none;border-radius:12px;background:linear-gradient(90deg,var(--orange),var(--purple));color:white;font-weight:800;font-size:14px;cursor:pointer;}
.topBar button:disabled{opacity:.6;cursor:not-allowed;}
.durum{text-align:center;font-size:13px;color:var(--gray);margin-top:8px;}
.uyari{background:#FFFBEB;border:1px solid #FDE68A;border-radius:12px;padding:10px 12px;font-size:12px;color:#92400E;margin-bottom:14px;}

.ogrenciBlok{margin-bottom:30px;}

/* ============ KARNE (referans görsele sadık) ============ */
.karneCard{
  background:white;border-radius:22px;padding:24px;
  border:1px solid #EDE9FE;box-shadow:0 20px 45px rgba(139,92,246,.14);
}
.khHeader{display:flex;justify-content:space-between;align-items:center;padding-bottom:10px;margin-bottom:12px;}
.khBrand{display:flex;align-items:center;gap:14px;}
.khLogo{width:54px;height:54px;flex-shrink:0;}
.khTitle{font-size:27px;font-weight:800;color:var(--dark);line-height:1.1;}
.khTitle span{color:var(--orange);font-style:normal;}
.khTitle .pipeSep{color:var(--dark);font-style:normal;font-weight:900;}
.khSub{font-size:10px;letter-spacing:2.5px;color:#64748B;font-weight:700;margin-top:2px;}
.khDate{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--dark);}

.khInfoBox{border:1px solid #F1E9FE;border-radius:16px;padding:12px 16px;margin-bottom:12px;display:flex;}
.khInfoItem{flex:1;display:flex;align-items:center;gap:10px;}
.khInfoItem+.khInfoItem{padding-left:16px;margin-left:6px;}
.khInfoIcon{width:30px;height:30px;flex-shrink:0;}
.khInfoLabel{font-size:10px;letter-spacing:1px;color:#64748B;font-weight:700;}
.khInfoValue{font-size:14px;font-weight:800;color:var(--dark);line-height:1.25;margin-top:2px;}

.khStatsBox{border:1px solid #F1E9FE;border-radius:18px;padding:14px 16px;display:flex;margin-bottom:12px;}
.khStat{flex:1;text-align:center;}
.khStatLabel{font-size:11px;letter-spacing:1px;color:#64748B;font-weight:800;}
.khStatValue{font-size:38px;font-weight:900;margin-top:4px;}
.khUnderline{width:34px;height:3px;border-radius:3px;margin:6px auto 0;}
.khSiraSub{font-size:11px;color:var(--dark);font-weight:800;margin-top:4px;}
.khBadge{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:12px;padding:7px 12px;border-radius:20px;margin-top:8px;}

.khBottomRow{border:1px solid #F1E9FE;border-radius:18px;padding:12px 16px;display:flex;gap:18px;margin-bottom:14px;}
.khDYB{display:flex;flex-direction:row;gap:16px;flex-shrink:0;align-items:center;}
.khDYBItem{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:800;white-space:nowrap;}
.khDivider{width:1px;background:#F1E9FE;}
.khCompare{flex:1;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.khCompareTitle{font-size:11px;letter-spacing:1px;color:#64748B;font-weight:800;margin-bottom:2px;}
.khCompareRow{display:flex;align-items:center;gap:8px;}
.khCompareLabel{font-size:12px;font-weight:700;color:var(--gray);width:56px;flex-shrink:0;}
.khBarBg{flex:1;height:9px;background:#E2E8F0;border-radius:6px;overflow:hidden;}
.khBarFill{height:100%;border-radius:6px;}
.khCompareVal{font-size:12px;font-weight:800;width:44px;text-align:right;flex-shrink:0;}

.khSectionTitle{font-weight:900;color:var(--dark);font-size:15px;margin:14px 0 0;display:flex;align-items:center;gap:8px;}
.khSectionUnderline{width:100%;height:2px;background:#EDE4FE;margin:6px 0 10px;}
.khColHeader{display:flex;justify-content:space-between;font-size:10.5px;letter-spacing:1px;color:#64748B;font-weight:800;margin-bottom:8px;padding-bottom:4px;border-bottom:1px solid #F1F5F9;}

.konuRow{margin-bottom:8px;display:flex;align-items:center;gap:10px;}
/* Alt konular (içerik): alt alta satırlar — ad, çubuk, başarı oranı. %50 ve altı (oran/çubuk rengindeki "kırmızı" sınırla aynı)
   açık kırmızı zeminle vurgulanır; zemin, metin hizasını bozmamak için negatif kenar boşluğu + iç boşlukla verilir. */
.altListe{margin-top:6px;}
.altSatir{display:flex;align-items:center;gap:10px;font-size:11px;font-weight:600;color:#475569;line-height:1.2;margin:3px -6px 0;padding:1px 6px;border-radius:6px;}
.altSatir.zayif{background:#FEF2F2;border-left:3px solid #FCA5A5;}
.altSatir.orta{background:#EFF6FF;border-left:3px solid #93C5FD;}
.altSatir.guclu{background:#F0FDF4;border-left:3px solid #86EFAC;}
.altAd{flex:0 0 44%;}
.altBarBg{flex:1;height:5px;background:#E2E8F0;border-radius:4px;overflow:hidden;display:block;}
.altBarFill{display:block;height:100%;border-radius:4px;}
.altOran{flex:0 0 38px;text-align:right;font-weight:800;}
.konuOran{font-weight:800;}
.konuRow.altli{align-items:flex-start;}
.konuIcon{width:28px;height:28px;border-radius:50%;color:white;font-weight:800;font-size:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.konuBody{flex:1;}
.konuTop{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-bottom:4px;}
.konuBarBg{width:100%;height:8px;background:#E2E8F0;border-radius:6px;overflow:hidden;}
.konuAltKazanim{font-size:10.5px;color:#B91C1C;font-weight:600;margin-top:3px;}
.netTrendUp{font-size:10px;color:#16A34A;font-weight:800;margin-top:5px;}
.netTrendDown{font-size:10px;color:#DC2626;font-weight:800;margin-top:5px;}
.netTrendSame{font-size:10px;color:#94A3B8;font-weight:800;margin-top:5px;}
.sinifUyariKutu{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;font-size:12px;font-weight:600;padding:12px 14px;border-radius:12px;margin-top:14px;line-height:1.6;}
.sinifUyariKutu b{font-weight:900;display:block;margin-bottom:6px;}
.sinifUyariSatir{margin-top:4px;}
.sinifOncelikKutu{background:#FEF2F2;color:#991B1B;font-size:12px;font-weight:600;padding:12px 14px;border-radius:12px;margin-top:16px;}
.sinifOncelikKutu b{font-weight:900;}

/* Veri sorunları kutusu (sınav getirilince en üstte): hata varsa kırmızı, yalnız uyarı varsa sarı */
.veriSorunKutu{background:#FEF2F2;border:1px solid #FCA5A5;color:#991B1B;font-size:12.5px;font-weight:600;padding:14px 16px;border-radius:14px;margin-bottom:20px;line-height:1.6;}
.veriSorunKutu.sadeceUyari{background:#FFFBEB;border-color:#FDE68A;color:#92400E;}
.veriSorunKutu b{display:block;font-weight:900;font-size:13.5px;margin-bottom:8px;}
.veriSorunSatir{margin-top:6px;}
.konuBarFill{height:100%;border-radius:6px;}

.khFooterSagAlt{flex:1;display:flex;flex-direction:column;align-items:flex-end;gap:2px;}

.surekliZayifMini{display:inline-block;background:#FEE2E2;color:#B91C1C;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:7px;margin-left:4px;vertical-align:middle;}

.khFooter{display:flex;align-items:center;gap:16px;border-top:2px solid #F5F3FF;margin-top:14px;padding-top:12px;}
/* Sabit oranlı (telefon ekranı) çerçeve modu: karne hep aynı en/boy oranında üretilir; içerik kısaysa kalan boşluk
   üst bloklar arasına dağıtılır, "içerik + alt bilgi" grubu ise hep aşağıda, birbirine bitişik kalır. */
.karneCard.sabitOran{border-radius:0;border:none;box-shadow:none;box-sizing:border-box;display:flex;flex-direction:column;justify-content:space-between;}
.karneCard.sabitOran .khSectionTitle{margin-top:0;}
.khQr{width:64px;height:64px;border-radius:8px;flex-shrink:0;}
.khFooterText{font-size:11px;color:var(--gray);line-height:1.4;flex:1;background:#F8F5FF;padding:10px 12px;border-radius:10px;}
.khFooterText b{color:var(--dark);}

.aksiyonlar{display:flex;gap:10px;margin-top:14px;}
.aksiyonlar button{flex:1;padding:13px;border:none;border-radius:12px;font-weight:800;font-size:13px;cursor:pointer;}
.btnPng{background:var(--dark);color:white;}
.btnWa{background:#25D366;color:white;}
.btnWa:disabled{background:#CBD5E1;cursor:not-allowed;}
.btnWa.btnWaGonderildi{background:#DCFCE7;color:#166534;border:1px solid #86EFAC;}
.btnWa2{background:var(--purple);color:white;width:100%;}
.btnWa2:disabled{background:#CBD5E1;cursor:not-allowed;}
.telefonYok{font-size:11px;color:#DC2626;margin-top:6px;text-align:center;}

/* Öğrenci listesi: sınıf büyüdükçe sayfa şişmesin diye her öğrenci için KISA bir satır çizilir.
   Karne görseli (büyük kart) baştan çizilmez: "Karneyi Kopyala"ya basılınca ekran DIŞINDA anlık
   oluşturulur (bkz. karneyiKopyala), "Önizle"ye basılınca aynı HTML ekran İÇİNDE gösterilir. */
.ogrenciSatir{background:white;border:1px solid #E5E7EB;border-radius:14px;padding:12px 14px;margin-bottom:10px;}
.ogrenciSatirUst{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;}
.ogrenciAd{font-weight:800;color:var(--dark);font-size:14px;}
.gonderildiRozet{display:inline-block;background:#F0FDF4;color:#166534;border:1px solid #BBF7D0;font-size:10.5px;font-weight:800;padding:2px 8px;border-radius:8px;margin-left:8px;vertical-align:middle;}
.ogrenciOzet{font-size:12px;color:var(--gray);font-weight:700;}
.ogrenciSatir .aksiyonlar{margin-top:10px;}
.ogrenciSatir .aksiyonlar button{padding:10px;}
.btnOnizle{width:100%;padding:10px;border:1px solid #E2E8F0;border-radius:12px;background:white;color:var(--dark);font-weight:700;font-size:12.5px;cursor:pointer;}
.onizleAlan{margin-top:12px;}
.onizleAlan .karneCard{box-shadow:0 8px 20px rgba(139,92,246,.10);}
/* Satır içi bildirim (pencere yerine): yeşil = işlem tamam, sarı = dikkat, kırmızı = hata */
.satirDurum{font-size:12px;font-weight:700;line-height:1.5;margin-top:8px;padding:8px 10px;border-radius:10px;}
.satirDurum:empty{display:none;}
.satirDurum.ok{background:#F0FDF4;border:1px solid #BBF7D0;color:#166534;}
.satirDurum.uyari{background:#FFFBEB;border:1px solid #FDE68A;color:#92400E;}
.satirDurum.hata{background:#FEF2F2;border:1px solid #FECACA;color:#B91C1C;}
.karneGeciciAlan{position:fixed;left:-10000px;top:0;}
</style>
</head>
<body>
<div class="wrap">

  <div class="topBar">
    <h2>📇 Karne Görseli Üretici</h2>
    <div class="uyari">Bu sayfa sadece senin kullanman içindir, linkini velilerle paylaşma (veli telefon numaralarını ve öğrenci giriş kodlarını gösteriyor).</div>
    <form onsubmit="listeGetir(); return false;">
      <input type="text" id="sinavIdInput" placeholder="Sınav ID (örn: D801)" aria-label="Sınav ID">
      <input type="password" id="anahtarInput" placeholder="Gizli Anahtar" aria-label="Gizli anahtar">
      <button type="submit" id="getirBtn">Karneleri Getir</button>
    </form>
    <div class="durum" id="durum" role="status" aria-live="polite"></div>
  </div>

  <div id="liste"></div>

  <div class="surumBilgi">FatihHoca UltraMat · Karne Üretici · sürüm 3.0 (22.09.2026)</div>

</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxh0Rv69xsEA_xdYPFbuCcR7MfRYQ4keE301jHR69iVYEpDgxZ3h1Ep0ZuqdEZqRfW74A/exec";
// Öğrenci sonuç sayfasının adresi (protokolsüz; WhatsApp mesajında düz metin olarak kullanılır). Karnedeki
// QR_IMG bunu gösteren AYRI, sabit gömülü bir görseldir (harici QR servisine bağımlı olmasın diye); bu
// adres değişirse hem bu sabit hem de QR_IMG yeniden üretilmelidir (aşağıda, karneKartiHtml öncesi).
const SITE_ADRESI = "fatihhocaultramath.github.io/sonuc/";

// v2: Sabit cümle havuzundan rastgele not seçme (notHavuzu/notSec) kaldırıldı. Not: karne
// görseli bilinçli olarak özlü tutuluyor (orijinal tasarımın "detaylı hali sitede" ilkesi
// korunuyor), bu yüzden Code.gs'in ürettiği o.fatihNotu / o.narratif metinleri burada
// GÖSTERİLMİYOR — sadece öğrencinin kendi sonuç sayfasında (index.html) görünüyor. Bu alanlar
// API yanıtında hazır bulunuyor; ileride WhatsApp mesajına kısa bir alıntı eklemek istenirse
// kullanılabilir.

function guvenBadge(guven){
  if(!guven) return "";
  const etiket = {yüksek:"yüksek güven", orta:"orta güven", düşük:"düşük güven", yetersiz:"yetersiz veri", yok:"veri yok"}[guven] || guven;
  const renkler = {yüksek:["#DCFCE7","#166534"], orta:["#DBEAFE","#1E40AF"], düşük:["#FEF3C7","#92400E"], yetersiz:["#F1F5F9","#475569"], yok:["#F1F5F9","#475569"]};
  const r = renkler[guven] || renkler.yetersiz;
  return `<span style="display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:7px;margin-left:5px;background:${r[0]};color:${r[1]};white-space:nowrap;">${etiket}</span>`;
}

// Veli telefonunu WhatsApp'ın beklediği biçime (ülke koduyla, yalnızca rakam) getirir.
// - Girdi "+" ile başlıyorsa ya da rakamlara çevrilince "00" ile başlıyorsa, kullanıcının zaten bir ülke
//   kodu yazdığı kabul edilir: yalnızca uluslararası erişim öneki "00" atılır, başka dokunulmaz. (Eski
//   sürüm bunu ayırt etmiyordu: "0090 532..." gibi baştan ülke koduyla yazılmış bir Türkiye numarasını
//   "900905321234567" gibi yanlış bir sonuca, "+49 170..." gibi yurt dışı bir numarayı da başına 90
//   ekleyerek bozuyordu.)
// - Aksi halde yurt içi (Türkiye) numara varsayılır: baştaki tek "0" (varsa) atılır, "90" eklenir
//   ("90" ile zaten başlıyorsa tekrar eklenmez).
function normalizeTelefon(telefon){
  let raw = String(telefon||"").trim();
  let digits = raw.replace(/[^0-9]/g,"");
  if(raw.indexOf("+")===0 || digits.indexOf("00")===0){
    return digits.replace(/^00/,"");
  }
  digits = digits.replace(/^0/,"");
  if(digits.indexOf("90")===0 && digits.length>10) return digits;
  return "90"+digits;
}

// Kaba bir "bu numara açıkça hatalı/eksik girilmiş" kontrolü (tam biçim doğrulaması değil). Ogrenciler
// sayfasına "1234" gibi bir şey yazılmışsa WhatsApp düğmelerini kilitler ve öğretmeni uyarır — eskiden
// bu durumda uyarı yoktu, düğmeler sessizce yanlış bir numarayla WhatsApp'ı açardı.
function telefonCokKisaMi(telefon){
  let digits = String(telefon||"").replace(/[^0-9]/g,"");
  return digits.length > 0 && digits.length < 7;
}

function performansRengi(yuzde){
  if(yuzde>=90) return "#16A34A";
  if(yuzde>50) return "#2563EB";
  return "#DC2626";
}

// Genel başarı rozetinin rengi artık YAZAN İFADEYE göre değişir (Code.gs → basariEtiketiHesapla:
// Mükemmel/Çok İyi/İyi/Geliştirilmeli — sabit 4 etiket, sınıf 7-8 için puan eşiği 90/70/50, 5-6 için
// 67.5/52.5/37.5). Kartın geri kalanında zaten kurulu renk diliyle aynı sırayı izler: en iyi = yeşil
// (performansRengi'nin %90+ yeşiliyle aynı ton), sonra mavi (performansRengi'nin >%50 mavisiyle aynı),
// sonra amber (sayfadaki diğer "dikkat" kutularıyla aynı — .uyari, .satirDurum.uyari, .veriSorunKutu.
// sadeceUyari), en düşük = kırmızı (performansRengi'nin %50-altı kırmızısıyla ve zayıf alt konu
// vurgusuyla — .altSatir.zayif — aynı). Yeni bir etiket ileride eklenirse (bu dört isim dışında bir şey
// gelirse) nötr gri kullanılır, kart bozulmaz.
function basariRenkleri(etiket){
  const RENK = {
    "Mükemmel":       { bg: "#ECFDF5", fg: "#16A34A" },
    "Çok İyi":        { bg: "#EFF6FF", fg: "#2563EB" },
    "İyi":            { bg: "#FFFBEB", fg: "#92400E" },
    "Geliştirilmeli": { bg: "#FEF2F2", fg: "#B91C1C" }
  };
  return RENK[etiket] || { bg: "#F1F5F9", fg: "#475569" };
}

function konuIkon(konu){
  konu = (konu||"").toLowerCase();
  if(konu.includes("üslü")) return "aⁿ";
  if(konu.includes("karekök")) return "√x";
  if(konu.includes("çarpan")) return "123";
  if(konu.includes("cebir")) return "x+y";
  if(konu.includes("olasılık")) return "%";
  if(konu.includes("doğrusal")) return "y=x";
  if(konu.includes("üçgen")) return "△";
  if(konu.includes("dönüşüm")) return "⟳";
  if(konu.includes("cisim")) return "⬡";
  if(konu.includes("eşitsizlik")) return "≠";
  if(konu.includes("eğim")) return "∕";
  if(konu.includes("geometri")) return "∟";
  return "Σ";
}

// fetch'e yerleşik bir zaman aşımı yok; sunucu yanıt vermezse ekran süresiz "Yükleniyor..."
// durumunda kalmasın diye AbortController ile bunu ekliyoruz (index.html ile aynı desen).
async function fetchZamanAsimli(url, zamanAsimiMs){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), zamanAsimiMs);
  try{
    const response = await fetch(url, { signal: controller.signal });
    clearTimeout(timeoutId);
    return response;
  }catch(err){
    clearTimeout(timeoutId);
    if(err.name === "AbortError"){
      const zamanAsimiHatasi = new Error("ZAMAN_ASIMI");
      zamanAsimiHatasi.isTimeout = true;
      throw zamanAsimiHatasi;
    }
    throw err;
  }
}

  let anahtar = document.getElementById("anahtarInput").value.trim();
  let durum = document.getElementById("durum");
  let listeEl = document.getElementById("liste");

  if(!sinavID || !anahtar){ durum.innerHTML = "Sınav ID ve Anahtar gerekli."; return; }

  let butonMetni = buton.textContent;
  buton.disabled = true;
  buton.textContent = "⏳ Yükleniyor…";
  listeEl.innerHTML = "";
  durum.innerHTML = "Yükleniyor...";

  try{
    let url = `${API_URL}?sinavID=${encodeURIComponent(sinavID)}&liste=true&anahtar=${encodeURIComponent(anahtar)}`;
    let res = await fetchZamanAsimli(url, 20000);
    let data = await res.json();

    if(data && data.engellendi){ durum.innerHTML = "🔒 " + (data.mesajTr || "Çok fazla başarısız deneme yapıldı, biraz sonra tekrar deneyin."); return; }
    if(data && data.hata){
      // Yalnızca gerçekten yetkisizse "Anahtar hatalı" denir; diğer durumlarda (anahtar henüz
      // belirlenmemiş, sayfa adı bulunamadı vb.) sunucunun kendi açıklaması gösterilir.
      durum.innerHTML = (data.hata === "Yetkisiz")
        ? "❌ Anahtar hatalı."
        : "❌ " + (data.mesajTr || "Sunucu bir hata bildirdi. Lütfen daha sonra tekrar dene.");
      return;
    }
    // Sunucu { liste, veriSorunlari } döndürür (eski biçim: doğrudan dizi — ikisi de desteklenir).
    let liste = Array.isArray(data) ? data : (data && Array.isArray(data.liste) ? data.liste : null);
    let sorunlar = (data && !Array.isArray(data) && Array.isArray(data.veriSorunlari)) ? data.veriSorunlari : [];
    if(liste === null){ durum.innerHTML = "Sunucudan beklenmeyen bir yanıt geldi. Lütfen daha sonra tekrar dene."; return; }

    veriSorunlariKutusu(sorunlar);
    if(liste.length===0){ durum.innerHTML = "Bu Sınav ID'ye ait sonuç bulunamadı."; return; }

    durum.innerHTML = `${liste.length} öğrenci bulundu.` + (sorunlar.length ? ` ⚠️ Veride ${sorunlar.length} uyarı var, aşağıdaki kutuya bak.` : "");
    sinifRaporuOlustur(liste);
    liste.forEach((ogrenci, idx) => olustur(ogrenci, idx));

  }catch(err){
    durum.innerHTML = err && err.isTimeout
      ? "Sunucu 20 saniye içinde yanıt vermedi. Birazdan tekrar dene."
      : "Hata: " + err;
  }finally{
    buton.disabled = false;
    buton.textContent = butonMetni;
  }
}

// Sunucudan gelen metinler öğrenci adı içerebilir; ekrana basmadan önce HTML'e karşı korunur.
function htmlKacis(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

// NET KARŞILAŞTIRMASI çubuklarının genişliği: negatif net (örn. yanlış sayısı doğrudan fazlaysa net
// eksi çıkabilir) eskiden geçersiz bir yüzde (negatif width) üretip CSS'in bunu yok sayması yüzünden
// çubuk YANLIŞLIKLA tam dolu görünüyordu. Artık 0 ile 100 arasına sabitleniyor (negatif net = boş çubuk).
function barGenislik(deger, olcek){
  if(!isFinite(deger) || !isFinite(olcek) || olcek<=0) return 0;
  return Math.max(0, Math.min(100, (deger/olcek)*100));
}

// Sınavın verisindeki sorunları (çift kayıt, boş satır, boş cevap anahtarı, sütun uyuşmazlığı, tarih yok...)
// karneleri göndermeden ÖNCE görülsün diye listenin en üstünde gösterir. Hata varsa kırmızı, yalnız uyarı varsa sarı.
function veriSorunlariKutusu(sorunlar){
  if(!sorunlar || sorunlar.length === 0) return;
  let hataSayisi = sorunlar.filter(s => s.seviye === "hata").length;
  let baslik = hataSayisi
    ? `⛔ Bu sınavın verisinde düzeltilmesi gereken ${hataSayisi} sorun var — karneler yanlış olabilir`
    : `⚠️ Bu sınavın verisinde dikkat edilmesi gereken noktalar var`;
  let satirlar = sorunlar.map(s => `<div class="veriSorunSatir">${s.seviye === "hata" ? "⛔" : "⚠️"} ${htmlKacis(s.mesaj)}</div>`).join("");
  let kutu = document.createElement("div");
  kutu.className = "veriSorunKutu" + (hataSayisi ? "" : " sadeceUyari");
  kutu.innerHTML = `<b>${baslik}</b>${satirlar}`;
  document.getElementById("liste").appendChild(kutu);
}

function sinifRaporuOlustur(data){
  let listeEl = document.getElementById("liste");

  // Her konunun sınıf ortalamasını topla (Code.gs'ten her öğrencide aynı gelen sinifOrtalamaYuzde alanı kullanılıyor).
  // soruSayisi da bu sınavdaki soru sayısıdır (her öğrencide aynı) — az soruluk bir konuda
  // sınıf ortalamasının da "düşük güven" olduğunu belirtmek için kullanılıyor.
  let konuMap = {};
  data.forEach(o=>{
    (o.konular||[]).forEach(k=>{
      if(konuMap[k.konu] === undefined && k.sinifOrtalamaYuzde !== undefined && k.sinifOrtalamaYuzde !== null){
        konuMap[k.konu] = { yuzde: k.sinifOrtalamaYuzde, soruSayisi: k.soruSayisi || 0 };
      }
    });
  });

  let konuListesi = Object.keys(konuMap).map(konu=>({
    konu, yuzde: konuMap[konu].yuzde, soruSayisi: konuMap[konu].soruSayisi,
    guven: konuMap[konu].soruSayisi >= 15 ? 'yüksek' : (konuMap[konu].soruSayisi >= 6 ? 'orta' : 'düşük')
  })).sort((a,b)=>a.yuzde-b.yuzde);
  if(konuListesi.length === 0) return;

  let oncelikli = konuListesi.filter(k=>k.yuzde<60).slice(0,3);

  // Sınıf genelinde, her konuda en çok yanlış/boş yapılan Alt Kazanım'ları topla
  let konuAltKazanimMap = {};
  data.forEach(o=>{
    (o.sorular||[]).forEach(s=>{
      if(s.durum!=="Dogru" && s.altKazanim){
        if(!konuAltKazanimMap[s.konu]) konuAltKazanimMap[s.konu] = {};
        konuAltKazanimMap[s.konu][s.altKazanim] = (konuAltKazanimMap[s.konu][s.altKazanim]||0)+1;
      }
    });
  });
  function sinifAltKazanimlari(konu){
    let m = konuAltKazanimMap[konu];
    if(!m) return [];
    return Object.keys(m).sort((a,b)=>m[b]-m[a]);
  }

  let satirlarHtml = "";
  konuListesi.forEach(k=>{
    let renk = performansRengi(k.yuzde);
    let altKazanimlarBu = sinifAltKazanimlari(k.konu);
    let altKazanimHtml = (altKazanimlarBu.length && k.yuzde < 90)
      ? `<div class="konuAltKazanim">Sınıfta en çok zorlanılan: ${altKazanimlarBu.slice(0,3).map(htmlKacis).join(", ")}</div>` : "";
    satirlarHtml += `
      <div class="konuRow">
        <div class="konuIcon" style="background:${renk}">${konuIkon(k.konu)}</div>
        <div class="konuBody">
          <div class="konuTop"><span>${htmlKacis(k.konu)}</span><span style="color:${renk}">%${k.yuzde}${guvenBadge(k.guven)}</span></div>
          <div class="konuBarBg"><div class="konuBarFill" style="width:${k.yuzde}%;background:${renk}"></div></div>
          ${altKazanimHtml}
        </div>
      </div>`;
  });

  let oncelikliHtml = oncelikli.length
    ? `<div class="sinifOncelikKutu"><b>Sınıfın öncelikli çalışma alanları:</b> ${oncelikli.map(k=>htmlKacis(k.konu)).join(", ")}</div>`
    : "";

  // Bir soruyu sınıfın büyük çoğunluğu yanlış/boş bırakmışsa, bu genelde "bireysel bir öğrenci
  // eksiği" değil, "bu konuyu sınıfa yeniden anlatmalı mıyım?" sorusudur — farklı bir aksiyon
  // gerektirir. dogruKacKisi/yanlisKacKisi/bosKacKisi her öğrencide aynı geldiği için tek bir
  // öğrencinin (data[0]) verisinden okumak yeterli, sınıf genelini yeniden hesaplamaya gerek yok.
  let soruMap = {};
  ((data[0] && data[0].sorular) || []).forEach(s=>{
    let toplam = (s.dogruKacKisi||0) + (s.yanlisKacKisi||0) + (s.bosKacKisi||0);
    if(toplam > 0) soruMap[s.no] = { konu: s.konu, yanlisVeBos: (s.yanlisKacKisi||0) + (s.bosKacKisi||0), toplam };
  });
  let zorlananSorular = Object.keys(soruMap).map(no=>{
    let s = soruMap[no];
    return { no, konu: s.konu, oran: Math.round((s.yanlisVeBos/s.toplam)*100), yanlisVeBos: s.yanlisVeBos, toplam: s.toplam };
  }).filter(s => s.oran >= 60 && s.toplam >= 3).sort((a,b)=>b.oran-a.oran);

  let zorlananHtml = zorlananSorular.length
    ? `<div class="sinifUyariKutu"><b>⚠️ Sınıfın çoğunluğu bu sorularda zorlandı — bireysel bir eksiklikten çok, konunun sınıfa yeniden anlatılması gerekebilir:</b>${
        zorlananSorular.map(s => `<div class="sinifUyariSatir">Soru ${s.no} (${htmlKacis(s.konu)}) — ${s.toplam} kişiden ${s.yanlisVeBos}'i yanlış/boş bıraktı (%${s.oran})</div>`).join("")
      }</div>`
    : "";

  let blok = document.createElement("div");
  blok.className = "ogrenciBlok";
  blok.innerHTML = `
    <div class="karneCard">
      <div class="khSectionTitle">${BOOK_SVG} SINIF GENELİ İÇERİK ANALİZİ</div>
      <div class="khSectionUnderline"></div>
      <div class="khColHeader"><span>İÇERİK</span><span>SINIF ORTALAMASI</span></div>
      ${satirlarHtml}
      ${oncelikliHtml}
      ${zorlananHtml}
    </div>
  `;
  listeEl.appendChild(blok);
}

// Satır içi bildirim: pencere (alert) yerine öğrencinin kendi satırında gösterilir; tıklama gerektirmez, sayfayı engellemez.
//  tur "ok"   : yeşil, sureMs sonra kaybolur. Aynı anda yalnızca BİR satırda görünür — panoda şu an hangi öğrencinin
//               karnesi/mesajı olduğunu gösterir (yanlış veliye yapıştırma riskini azaltır).
//  tur "uyari": sarı, "hata": kırmızı — o satırda bir sonraki işleme kadar kalır.
let bildirimZamanlayicilari = {};
function satirBildirimi(idx, metin, tur, sureMs){
  let el = document.getElementById("durum_" + idx);
  if(!el) return;
  clearTimeout(bildirimZamanlayicilari[idx]);
  if(tur === "ok"){
    document.querySelectorAll(".satirDurum.ok").forEach(function(diger){
      if(diger !== el){ diger.textContent = ""; diger.className = "satirDurum"; }
    });
  }
  el.className = "satirDurum " + tur;
  el.textContent = metin;
  if(sureMs){
    bildirimZamanlayicilari[idx] = setTimeout(function(){ el.textContent = ""; el.className = "satirDurum"; }, sureMs);
  }
}
function satirBildirimiTemizle(idx){
  let el = document.getElementById("durum_" + idx);
  if(!el) return;
  clearTimeout(bildirimZamanlayicilari[idx]);
  el.textContent = ""; el.className = "satirDurum";
}

// Karne görselinin HTML'i (büyük kart). Sayfada önceden çizilmez; "Karneyi Kopyala"ya basılınca ekran
// DIŞINDA (bkz. karneyiKopyala), "Önizle"ye basılınca ekran İÇİNDE anlık oluşturulur (bkz. olustur).
function karneKartiHtml(o, cardId){
  let toplamSoru = (Number(o.dogru)||0)+(Number(o.yanlis)||0)+(Number(o.bos)||0);
  let olcek = Math.max(toplamSoru, Number(o.net)||0, Number(o.sinifNetOrtalamasi)||0, 1);
  let senNet = Number(o.net)||0;
  let ortNet = Number(o.sinifNetOrtalamasi)||0;
  let puanSayi = Number(o.puan)||0;
  let ilkYuzde = o.yuzdelikDilim || null;
  let basariRenk = basariRenkleri(o.basari); // "yazan ifadeye göre" renk (bkz. basariRenkleri tanımı)

  // v2: Konu listesi artık BU SINAVA özel (küçük örneklem, gürültülü) değil,
  // öğrencinin tüm geçmiş sınavları HAVUZLANARAK Code.gs'te hesaplanmış
  // "konularKumulatif" alanından geliyor — 2 sorudan %100 ile 20 sorudan %90
  // artık aynı ağırlıkta gösterilmiyor, her satırda güven rozeti var.
  // v2.5: Karnedeki içerik listesi SON SINAVDA çıkan konulardan (o.konular) oluşur ve her konunun ALT KONULARI
  // (Soru_Haritasi "İçerik" / eski adıyla "Alt Kazanım" sütunu) gösterilir. Geçmiş sınavların havuzlanmış verisi
  // yalnızca "Sürekli Zayıf" işaretinde kullanılır (v2.8: "en güçlü / en çok gelişen konu" rozetleri kaldırıldı).
  let sinavKonulari = [...(o.konular||[])].sort((a,b)=>a.yuzde-b.yuzde);
  let surekliZayifAdlari = {};
  (o.konularKumulatif||[]).forEach(function(k){ if(k.surekliZayif) surekliZayifAdlari[k.konu] = true; });

  let netTrendHtml = "";
  if(o.netTrend !== undefined && o.netTrend !== null){
    if(o.netTrend > 0) netTrendHtml = `<div class="netTrendUp">▲ Önceki sınava göre ${o.netTrend} net artış</div>`;
    else if(o.netTrend < 0) netTrendHtml = `<div class="netTrendDown">▼ Önceki sınava göre ${Math.abs(o.netTrend)} net azalış</div>`;
    else netTrendHtml = `<div class="netTrendSame">— Önceki sınavla aynı net</div>`;
  }

  // Alt konu (içerik) satırları: alt alta; her satırda ad + başarı çubuğu + başarı oranı (%). Üç seviye —
  // performansRengi ile aynı sınırlar (%50 ve altı zayıf/kırmızı, %50-90 arası orta/mavi, %90+ güçlü/yeşil) —
  // satırın zeminini ve sol kenar çizgisini de aynı renk ailesiyle boyar (bkz. .altSatir.zayif/.orta/.guclu).
  // Sıra: düşükten yükseğe (en zayıf üstte).
  function altKonuHtml(k){
    let liste = (k.altKazanimlar || []).map(function(a){
      let y = (typeof a.yuzde === "number") ? a.yuzde : (a.soruSayisi ? Math.round(a.dogruSayisi / a.soruSayisi * 1000) / 10 : 0);
      return { ad: a.altKazanim, yuzde: y };
    }).sort(function(x, y){ return x.yuzde - y.yuzde; });
    if(!liste.length) return "";
    return `<div class="altListe">` + liste.map(function(a){
      let r = performansRengi(a.yuzde);
      let seviye = a.yuzde <= 50 ? "zayif" : (a.yuzde >= 90 ? "guclu" : "orta");
      return `<div class="altSatir ${seviye}"><span class="altAd">${htmlKacis(a.ad)}</span><span class="altBarBg"><span class="altBarFill" style="width:${a.yuzde}%;min-width:4px;background:${r}"></span></span><span class="altOran" style="color:${r}">%${a.yuzde}</span></div>`;
    }).join("") + `</div>`;
  }

  let konularHtml = "";
  sinavKonulari.forEach(k=>{
    let renk = performansRengi(k.yuzde);
    let surekliZayifHtml = surekliZayifAdlari[k.konu] ? `<span class="surekliZayifMini">⚠ Sürekli Zayıf</span>` : "";
    konularHtml += `
      <div class="konuRow altli">
        <div class="konuIcon" style="background:${renk}">${konuIkon(k.konu)}</div>
        <div class="konuBody">
          <div class="konuTop"><span>${htmlKacis(k.konu)}${surekliZayifHtml}</span><span class="konuOran" style="color:${renk}">%${k.yuzde}</span></div>
          <div class="konuBarBg"><div class="konuBarFill" style="width:${k.yuzde}%;background:${renk}"></div></div>
          ${altKonuHtml(k)}
        </div>
      </div>`;
  });

  // (Not: "Önerilen Çalışma Planı" karneden kaldırıldı, detaylı hali sitede. "Fatih Hoca'nın Notu" kutusu da kaldırıldı, imza artık kartın sağ altında.)

  return `
    <div class="karneCard" id="${cardId}">

      <div class="khHeader">
        <div class="khBrand">
          <div class="khLogo">${LOGO_SVG}</div>
          <div>
            <div class="khTitle">FatihHoca <span class="pipeSep">|</span> <span>UltraMat</span></div>
            <div class="khSub">MATEMATİK GELİŞİM ANALİZİ</div>
          </div>
        </div>
        ${o.tarihMetni ? `<div class="khDate">${CAL_SVG} ${htmlKacis(o.tarihMetni)}</div>` : ""}
      </div>

      <div class="khInfoBox">
        <div class="khInfoItem">
          <div class="khInfoIcon">${PERSON_SVG}</div>
          <div><div class="khInfoLabel">ÖĞRENCİ</div><div class="khInfoValue">${htmlKacis(o.isim)}</div></div>
        </div>
        <div class="khInfoItem">
          <div class="khInfoIcon">${SCHOOL_SVG}</div>
          <div><div class="khInfoLabel">SINIF</div><div class="khInfoValue">${htmlKacis(o.sinif)}. Sınıf<br>${htmlKacis(o.sube)} Şubesi</div></div>
        </div>
        <div class="khInfoItem">
          <div class="khInfoIcon">${CLIP_SVG}</div>
          <div><div class="khInfoLabel">SINAV</div><div class="khInfoValue">${htmlKacis(o.sinav)}</div></div>
        </div>
      </div>

      <div class="khStatsBox">
        <div class="khStat">
          <div class="khStatLabel">NET</div>
          <div class="khStatValue" style="color:var(--orange)">${o.net}</div>
          <div class="khUnderline" style="background:var(--orange)"></div>
          ${netTrendHtml}
        </div>
        <div class="khStat">
          <div class="khStatLabel">PUAN</div>
          <div class="khStatValue" style="color:var(--purple)">${o.puan!==undefined&&o.puan!==""?o.puan:"-"}</div>
          <div class="khUnderline" style="background:var(--purple)"></div>
        </div>
        <div class="khStat">
          <div class="khStatLabel">SIRALAMA</div>
          <div class="khStatValue" style="font-size:22px;color:var(--dark);margin-top:10px;display:flex;align-items:center;justify-content:center;gap:6px;">${BAR_SVG} ${o.sira?(o.sira+". / "+(o.katilim||"-")):"-"}</div>
          ${ilkYuzde ? `<div class="khSiraSub">İlk %${ilkYuzde}</div>` : ""}
          ${o.katilimNotu ? `<div class="khSiraSub" style="color:#92400E;font-weight:700;font-size:9.5px;">${htmlKacis(o.katilimNotu)}</div>` : ""}
        </div>
        <div class="khStat">
          <div class="khStatLabel">GENEL BAŞARI</div>
          <div class="khBadge" style="background:${basariRenk.bg};color:${basariRenk.fg}"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="${basariRenk.fg}" stroke-width="3"><circle cx="12" cy="12" r="10"/><path d="M7 12l3 3 7-7"/></svg> ${htmlKacis(o.basari||"-")}</div>
        </div>
      </div>

      <div class="khBottomRow">
        <div class="khDYB">
          <div class="khDYBItem">${CHECK_SVG} ${o.dogru} DOĞRU</div>
          <div class="khDYBItem">${X_SVG} ${o.yanlis} YANLIŞ</div>
          <div class="khDYBItem">${CIRCLE_SVG} ${o.bos} BOŞ</div>
        </div>
        <div class="khDivider"></div>
        <div class="khCompare">
          <div class="khCompareTitle">NET KARŞILAŞTIRMASI</div>
          <div class="khCompareRow">
            <div class="khCompareLabel" style="color:var(--orange)">Sen</div>
            <div class="khBarBg"><div class="khBarFill" style="width:${barGenislik(senNet,olcek)}%;background:linear-gradient(90deg,var(--orange),var(--purple))"></div></div>
            <div class="khCompareVal" style="color:var(--orange)">${senNet.toFixed(2)}</div>
          </div>
          <div class="khCompareRow">
            <div class="khCompareLabel" style="color:#94A3B8">Sınıf Ort.</div>
            <div class="khBarBg"><div class="khBarFill" style="width:${barGenislik(ortNet,olcek)}%;background:#94A3B8"></div></div>
            <div class="khCompareVal" style="color:var(--gray)">${o.sinifNetOrtalamasi!==null&&o.sinifNetOrtalamasi!==undefined?ortNet.toFixed(2):"-"}</div>
          </div>
        </div>
      </div>

      <div class="khAltGrup">
      <div class="khSectionTitle">${BOOK_SVG} İÇERİK ANALİZİ</div>
      <div class="khSectionUnderline"></div>
      <div class="khColHeader"><span>İÇERİK ÇERÇEVESİ / İÇERİK</span><span>BAŞARI ORANI</span></div>
      ${konularHtml || "<div style='font-size:12px;color:#64748B;'>Bu sınav için konu bilgisi bulunamadı.</div>"}

      <div class="khFooter">
        <img class="khQr" src="${QR_IMG}">
        <div class="khFooterText"><b>DETAYLI SONUÇLAR</b><br>Yanlış yaptığın sorular, doğru cevaplar ve detaylı içerik analizleri için QR kodu okut.</div>
        <div class="khFooterSagAlt">
          ${SLOGAN_IMG}
          ${SIGNATURE_IMG}
        </div>
      </div>
      </div>

    </div>
`;
}

// Karneyi SABİT oranlı çerçeveye oturtur: geçici kapta (DOM'da olmalı) kartı kurar, içeriğe uyan EN KÜÇÜK genişliği bulur
// (560'tan başlar), kartın minimum yüksekliğini oranı koruyacak şekilde ayarlar. İçerik kısaysa kalan boşluk kartın
// içinde (üst bloklar arasında) dağıtılır. Döner: { W, H } (CSS px).
function karneCerceveKur(kap, o, cardId){
  const ust = KARNE_UST_GUVENLI, alt = KARNE_ALT_GUVENLI;
  const kur = function(W){
    kap.style.width = W + "px";
    kap.innerHTML = karneKartiHtml(o, cardId);
    let kart = kap.querySelector("#" + cardId);
    kart.classList.add("sabitOran");
    kart.style.paddingTop = Math.round(ust * W) + "px";
    kart.style.paddingBottom = Math.round(alt * W) + "px";
    return kart;
  };
  let W = KARNE_GENISLIK;
  let kart = kur(W);
  let dogal = kart.getBoundingClientRect().height;
  for(let i = 0; i < 5 && dogal > W / KARNE_ORAN + 0.5 && W < KARNE_MAKS_GENISLIK; i++){
    // dogal = içerik + (ust+alt)*W ; sığması için içerik ≤ W*(1/oran - ust - alt)
    let icerik = dogal - (ust + alt) * W;
    let gereken = Math.ceil(icerik / (1 / KARNE_ORAN - ust - alt)) + 2;
    W = Math.min(KARNE_MAKS_GENISLIK, Math.max(W + 2, gereken));
    kart = kur(W);
    dogal = kart.getBoundingClientRect().height;
  }
  let H = Math.round(W / KARNE_ORAN);
  kart.style.minHeight = H + "px";
  return { W: W, H: H };
}

// "1. İlk Mesajı Gönder"e basılıp basılmadığını TARAYICIDA (localStorage) kalıcı olarak hatırlar —
// sayfa yenilense de, panel kapatılıp bir gün sonra dönülse de kaybolmaz. Sınav bazında ayrı tutulur
// (aynı öğrenci yeni bir sınavda tekrar "gönderilmemiş" görünür). Anahtar için öğrencinin iç "kod"u
// KULLANILAMAZ (tarayıcıya hiç gönderilmiyor, bkz. sonucNesnesiHafifDenBuild); bunun yerine ad+sınav+veli
// telefonu birleşimi kullanılır — aynı ad birden fazla öğrencide olabilse de (v2.2), aynı ad VE aynı veli
// telefonu pratikte tek bir aileye/öğrenciye işaret eder.
function gonderildiAnahtari(o){
  return "fhUltraMat_ilkMesajGonderildi::" + o.sinavID + "::" + o.isim + "::" + o.veliTelefon;
}
function ilkMesajGonderildiMi(o){
  try{ return localStorage.getItem(gonderildiAnahtari(o)) !== null; }
  catch(e){ return false; } // gizli sekme vb. localStorage kapalıysa sessizce "gönderilmemiş" say
}
function ilkMesajGonderildiIsaretle(o){
  try{ localStorage.setItem(gonderildiAnahtari(o), new Date().toISOString()); }
  catch(e){ /* kaydedilemezse sorun değil — bu sadece bir kolaylık özelliği, gönderimi engellemez */ }
}
function gonderildiUIGuncelle(idx, waBtn){
  let rozet = document.getElementById("gonderildiRozet_"+idx);
  if(rozet) rozet.style.display = "inline-block";
  waBtn.textContent = "✓ İlk Mesaj Gönderildi (tekrar gönder)";
  waBtn.classList.add("btnWaGonderildi");
}

// Öğrenci listesindeki KISA satır: ad, net/sıra özeti, Önizle + aynı üç numaralı işlem düğmesi.
// (Büyük kart burada çizilmez, bkz. karneKartiHtml.)
function olustur(o, idx){
  let listeEl = document.getElementById("liste");
  let blok = document.createElement("div");
  blok.className = "ogrenciSatir";

  let ozet = "Net " + htmlKacis(o.net) + " · Sıra " + (o.sira ? (o.sira + "/" + (o.katilim || "-")) : "-");
  let gonderildi = ilkMesajGonderildiMi(o);

  // Telefon eksik mi, yoksa (Ogrenciler sayfasına "1234" gibi) açıkça hatalı/çok kısa mı yazılmış —
  // ikisinde de WhatsApp düğmeleri kilitlenir, ama farklı bir uyarı metniyle (eskiden yalnızca "eksik"
  // durumu uyarıyordu; hatalı-ama-dolu bir numara sessizce yanlış bir WhatsApp bağlantısı açıyordu).
  let telefonUyariHtml = !o.veliTelefon
    ? `<div class="telefonYok">⚠️ Bu öğrencinin veli telefonu Ogrenciler sayfasında eksik.</div>`
    : (telefonCokKisaMi(o.veliTelefon)
        ? `<div class="telefonYok">⚠️ Bu öğrencinin veli telefonu hatalı görünüyor ("${htmlKacis(o.veliTelefon)}") — Ogrenciler sayfasında kontrol et.</div>`
        : "");

  blok.innerHTML = `
    <div class="ogrenciSatirUst">
      <div class="ogrenciAd">${htmlKacis(o.isim)}<span class="gonderildiRozet" id="gonderildiRozet_${idx}" style="${gonderildi ? "" : "display:none;"}">✓ Gönderildi</span></div>
      <div class="ogrenciOzet">${ozet}</div>
    </div>
    <div class="aksiyonlar" style="margin-top:10px;">
      <button class="btnOnizle" id="onizle_${idx}">👁️ Önizle</button>
    </div>
    <div class="onizleAlan" id="onizleAlan_${idx}" style="display:none;"></div>
    <div class="aksiyonlar">
      <button class="btnWa${gonderildi ? " btnWaGonderildi" : ""}" id="wa_${idx}">${gonderildi ? "✓ İlk Mesaj Gönderildi (tekrar gönder)" : "1. İlk Mesajı Gönder"}</button>
      <button class="btnPng" id="kopya_${idx}">2. Karneyi Kopyala</button>
    </div>
    <div class="aksiyonlar">
      <button class="btnWa2" id="waDetay_${idx}">3. Son Mesajı Kopyala</button>
    </div>
    ${telefonUyariHtml}
    ${!o.girisKodu ? `<div class="telefonYok">⚠️ Bu öğrencinin Giriş Kodu yok. Sheets menüsünden "🔑 Giriş Kodlarını Üret" komutunu çalıştır.</div>` : ""}
    <div class="satirDurum" id="durum_${idx}" role="status" aria-live="polite"></div>
  `;

  listeEl.appendChild(blok);

  // "Önizle": kartın TAM OLARAK export edilecek hâliyle aynı HTML'ini (karneKartiHtml) sayfanın içinde,
  // ekran dışına çıkmadan gösterir/gizler — kopyalamadan/göndermeden önce görsel bir kontrol imkânı.
  // İçerik yalnızca ilk açılışta bir kez kuruluyor (o, bu satırın ömrü boyunca değişmiyor), sonraki
  // tıklamalarda yalnızca gizle/göster.
  document.getElementById("onizle_"+idx).onclick = function(){
    let alan = document.getElementById("onizleAlan_"+idx);
    if(alan.style.display === "none"){
      if(!alan.dataset.dolduruldu){ alan.innerHTML = karneKartiHtml(o, "onizleKart_"+idx); alan.dataset.dolduruldu = "1"; }
      alan.style.display = "block";
      this.textContent = "✖️ Önizlemeyi Kapat";
    }else{
      alan.style.display = "none";
      this.textContent = "👁️ Önizle";
    }
  };

  document.getElementById("kopya_"+idx).onclick = function(){ karneyiKopyala(o, idx); };

  let waBtn = document.getElementById("wa_"+idx);
  let waDetayBtn = document.getElementById("waDetay_"+idx);
  if(!o.veliTelefon || telefonCokKisaMi(o.veliTelefon)){
    waBtn.disabled = true;
    waDetayBtn.disabled = true;
  } else {
    waBtn.onclick = function(){
      let telefon = normalizeTelefon(o.veliTelefon);
      let BAR_EMOJI = String.fromCodePoint(0x1F4CA);   // 📊
      let MEMO_EMOJI = String.fromCodePoint(0x1F4DA);  // 📚
      let PRAY_EMOJI = String.fromCodePoint(0x270D, 0xFE0F);  // ✍️
      // Veli Hitap doluysa ("Ali Bey", "Ayşe Hanım" gibi) kişiselleştirilmiş selamla başlar;
      // Ogrenciler sayfasında bu sütun yoksa ya da o satırda boşsa eski genel "Merhaba," aynen kalır.
      let selam = o.veliHitap ? `Merhaba ${o.veliHitap},` : `Merhaba,`;
      let mesaj = `${selam}\n\nÖğrencimiz ${o.isim} için hazırladığım *${o.sinav} Analiz Karnesi*'ni birazdan gönderiyorum.\n\n${BAR_EMOJI} Karnede; net, puan, sıralama, genel başarı ve içerik analizleri yer almaktadır.\n\n${MEMO_EMOJI} Karneyi incelemenizi rica eder, hayırlı günler dilerim.\n\n— Fatih Hoca ${PRAY_EMOJI}`;
      window.open(`https://web.whatsapp.com/send?phone=${telefon}&text=${encodeURIComponent(mesaj)}`, "whatsappSekmesi");
      ilkMesajGonderildiIsaretle(o);
      gonderildiUIGuncelle(idx, waBtn);
    };
    waDetayBtn.onclick = async function(){
      satirBildirimiTemizle(idx);
      let PIN_EMOJI = String.fromCodePoint(0x1F4CC);   // 📌
      let LINK_EMOJI = String.fromCodePoint(0x1F517);  // 🔗
      let mesaj2 = `${PIN_EMOJI} *Detaylı Sonuçlar*\n\nKarnede yer alan QR kodu veya aşağıdaki bağlantıyı kullanarak öğrencimizin detaylı sonuçlarına ulaşabilirsiniz.\n\n${LINK_EMOJI} ${SITE_ADRESI}\n\nGiriş için:\nAd Soyad: ${o.isim}\nGiriş Kodu: ${o.girisKodu}`;
      try{
        await navigator.clipboard.writeText(mesaj2);
        satirBildirimi(idx, "✅ Mesaj panoya kopyalandı — WhatsApp sohbetine yapıştır (Ctrl+V), sonra Gönder'e bas.", "ok", BILDIRIM_SURESI_MS);
      }catch(err){
        let telefon = normalizeTelefon(o.veliTelefon);
        window.open(`https://web.whatsapp.com/send?phone=${telefon}&text=${encodeURIComponent(mesaj2)}`, "whatsappSekmesi");
        satirBildirimi(idx, "⚠️ Pano kullanılamadı; mesaj WhatsApp'ta hazır metin olarak açıldı, Gönder'e basman yeterli.", "uyari");
      }
    };
  }
  // Giriş Kodu yoksa "Son Mesaj" kodsuz gitmesin diye kapalı kalır (ilk mesaj/karne etkilenmez).
  if(!o.girisKodu){ waDetayBtn.disabled = true; }
}

// "2. Karneyi Kopyala": karne kartı ekran DIŞINDA, sabit genişlikte anlık oluşturulur, görüntüsü alınıp panoya kopyalanır,
// sonra kart silinir. Böylece sayfa şişmez ve görsel pencere genişliğinden bağımsız hep aynı boyutta çıkar.
async function karneyiKopyala(o, idx){
  let btn = document.getElementById("kopya_" + idx);
  let btnMetni = btn.textContent;
  satirBildirimiTemizle(idx);
  btn.disabled = true;
  btn.textContent = "⏳ Hazırlanıyor…";

  let gecici = document.createElement("div");
  gecici.className = "karneGeciciAlan";
  let cardId = "karne_gecici_" + idx; // her satır için ayrı kimlik: aynı anda iki satıra basılırsa karneler karışmasın
  document.body.appendChild(gecici);
  try{
    karneCerceveKur(gecici, o, cardId); // sabit oranlı çerçeve (içeriğe göre en küçük uygun genişlik)
    let sonuc = await pngIndir(cardId, o.isim);
    if(sonuc === "pano"){
      satirBildirimi(idx, "✅ Karne panoya kopyalandı — WhatsApp sohbetine yapıştır (Ctrl+V), sonra Gönder'e bas.", "ok", BILDIRIM_SURESI_MS);
    }else{
      satirBildirimi(idx, "⬇️ Bu tarayıcıda panoya kopyalama desteklenmiyor; görsel indirildi (İndirilenler klasörü). WhatsApp sohbetine sürükleyip gönder.", "uyari");
    }
  }catch(err){
    console.error(err);
    let hataMetni = (typeof html2canvas === "undefined") ? "Görsel oluşturma bileşeni yüklenemedi" : (err && err.message ? err.message : String(err));
    satirBildirimi(idx, "⚠️ Karne kopyalanamadı (" + hataMetni + "). Sayfayı yenileyip tekrar dene.", "hata");
  }finally{
    gecici.remove();
    btn.disabled = false;
    btn.textContent = btnMetni;
  }
}

function canvasBlob(canvas){
  return new Promise(function(coz, reddet){
    canvas.toBlob(function(blob){ blob ? coz(blob) : reddet(new Error("görsel üretilemedi")); }, "image/png");
  });
}

async function pngIndir(cardId, isim){
  let el = document.getElementById(cardId);
  let canvas = await html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true});
  let blob = await canvasBlob(canvas);

  // Dönüş: "pano" (panoya kopyalandı) ya da "indirildi" (pano desteklenmiyor → dosya olarak indirildi). Bildirimi çağıran satır gösterir.
  try{
    await navigator.clipboard.write([ new ClipboardItem({ "image/png": blob }) ]);
    return "pano";
  }catch(err){
    // Panoya kopyalama desteklenmiyorsa (bazı tarayıcı/izin durumları), indirmeye geri düş
    let link = document.createElement("a");
    link.download = isim.trim().replace(/\s+/g,"_") + "_karne.png";
    link.href = canvas.toDataURL("image/png");
    link.click();
    return "indirildi";
  }
}
