<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Öğrenci Karnesi</title>
  <style>
    :root {
      --primary: #5c3882;
      --primary-light: #f3effa;
      --card-bg: #ffffff;
      --text-main: #2d2738;
      --text-muted: #6e6b7b;
      --border-color: #eee9f5;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #f7f5f9;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(92, 56, 130, 0.08);
    }

    /* Arama Kutusu */
    .search-box {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
      background: var(--primary-light);
      padding: 16px;
      border-radius: 16px;
    }

    .search-box input {
      padding: 12px 16px;
      border: 1px solid #dcd3e9;
      border-radius: 10px;
      outline: none;
      font-size: 14px;
    }

    .search-box button {
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }

    .search-box button:hover {
      background: #472a67;
    }

    /* Öğrenci Bilgileri */
    .header-info {
      margin-bottom: 20px;
    }

    .student-name {
      font-size: 24px;
      font-weight: 800;
      color: var(--primary);
    }

    .student-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-top: 4px;
    }

    .exam-tag {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 6px;
      font-weight: 500;
    }

    /* Büyük Net Kartı */
    .main-score-card {
      background: linear-gradient(135deg, #7952b3 0%, #f06a43 100%);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      color: white;
      margin-bottom: 20px;
      box-shadow: 0 8px 16px rgba(121, 82, 179, 0.25);
    }

    .main-score-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .main-score-val {
      font-size: 54px;
      font-weight: 900;
      line-height: 1.1;
      margin-top: 5px;
    }

    /* Izgara Kartlar (Doğru, Yanlış, Boş, Net) */
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #fff8f5;
      border: 1px solid #ffe8de;
      border-radius: 16px;
      padding: 14px;
      text-align: center;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .stat-val {
      font-size: 22px;
      font-weight: 800;
      color: var(--primary);
    }

    /* Bölümler */
    .section-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary);
      margin: 20px 0 10px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .info-card {
      background: var(--primary-light);
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      color: var(--text-main);
      line-height: 1.5;
    }

    /* Konu Analiz Barları */
    .topic-item {
      margin-bottom: 12px;
    }

    .topic-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .bar-bg {
      height: 8px;
      background: #e6e0f0;
      border-radius: 4px;
      overflow: hidden;
    }

    .bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 4px;
    }

    /* Geçmiş Sınavlar Tablosu */
    .history-list {
      background: #faf8fc;
      border-radius: 14px;
      padding: 8px 16px;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #eee6f7;
      font-size: 14px;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .history-score {
      font-weight: 700;
    }

    #loading {
      display: none;
      text-align: center;
      padding: 20px;
      color: var(--primary);
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Arama Paneli -->
    <div class="search-box">
      <input type="text" id="studentName" placeholder="Ad Soyad (Örn: Ali Kaya)">
      <input type="text" id="studentCode" placeholder="Öğrenci Kodu (Örn: 1234)">
      <button onclick="karneGetir()">Sonuçları Gör</button>
    </div>

    <div id="loading">Veriler Yükleniyor...</div>

    <!-- Karne İçeriği -->
    <div id="karneContent" style="display: none;">
      
      <div class="header-info">
        <div class="student-name" id="dispName">-</div>
        <div class="student-sub" id="dispClass">-</div>
        <div class="exam-tag" id="dispExam">-</div>
      </div>

      <!-- Üst Kart (SON SINAV NETİ) -->
      <div class="main-score-card">
        <div class="main-score-title">SON SINAV NETİ</div>
        <div class="main-score-val" id="dispMainNet">0</div>
      </div>

      <!-- Doğru, Yanlış, Boş, Net -->
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Doğru</div>
          <div class="stat-val" id="dispDogru">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Yanlış</div>
          <div class="stat-val" id="dispYanlis">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Boş</div>
          <div class="stat-val" id="dispBos">0</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Net</div>
          <div class="stat-val" id="dispNet">0</div>
        </div>
      </div>

      <!-- Matematik Gelişim Analizi -->
      <div class="section-title">📝 Matematik Gelişim Analizi</div>
      <div class="info-card" id="dispBasari">
        Henüz bir değerlendirme yapılmadı.
      </div>

      <!-- Öğretmen Notu -->
      <div class="section-title">👨‍🏫 Fatih Hoca'nın Notu</div>
      <div class="info-card" id="dispNot">
        Not bulunmuyor.
      </div>

      <!-- Konu Analizi -->
      <div class="section-title">📚 Konu Analizi</div>
      <div class="info-card" id="dispKonular">
        Konu analizi bulunamadı.
      </div>

      <!-- Geçmiş Sınavlar -->
      <div class="section-title">📚 Geçmiş Sınavlarım</div>
      <div class="history-list" id="dispGecmis">
        <!-- Geçmiş sınavlar buraya dinamik gelecek -->
      </div>

    </div>

  </div>

  <script>
    // APPS SCRIPT WEB APP URL SİNİ BURAYA YAPIŞTIRIN
    const API_URL = "YOUR_APPS_SCRIPT_WEB_APP_URL"; 

    function tarihFormatla(tarihStr) {
      if (!tarihStr) return "";
      try {
        let d = new Date(tarihStr);
        if (isNaN(d.getTime())) return tarihStr; // Zaten düzgün metinse doğrudan dön
        let gun = String(d.getDate()).padStart(2, '0');
        let ay = String(d.getMonth() + 1).padStart(2, '0');
        let yil = d.getFullYear();
        return `${gun}.${ay}.${yil}`;
      } catch(e) {
        return tarihStr;
      }
    }

    async function karneGetir() {
      const name = document.getElementById('studentName').value.trim();
      const code = document.getElementById('studentCode').value.trim();

      if (!name || !code) {
        alert("Lütfen hem Ad Soyad hem de Öğrenci Kodunu girin.");
        return;
      }

      document.getElementById('loading').style.display = 'block';
      document.getElementById('karneContent').style.display = 'none';

      try {
        const response = await fetch(`${API_URL}?isim=${encodeURIComponent(name)}&kod=${encodeURIComponent(code)}`);
        const data = await response.json();

        document.getElementById('loading').style.display = 'none';

        if (!data || data.length === 0) {
          alert("Öğrenci bulunamadı! Lütfen bilgileri kontrol edin.");
          return;
        }

        // En son sınav verisini al
        const sonSinav = data[data.length - 1];

        // Ekrana Verileri Bas
        document.getElementById('dispName').innerText = sonSinav.isim;
        document.getElementById('dispClass').innerText = `${sonSinav.sinif}. Sınıf - ${sonSinav.sube} Şubesi`;
        
        let t = tarihFormatla(sonSinav.tarih);
        document.getElementById('dispExam').innerText = `${sonSinav.sinav} | ${t}`;

        document.getElementById('dispMainNet').innerText = sonSinav.net;
        document.getElementById('dispDogru').innerText = sonSinav.dogru;
        document.getElementById('dispYanlis').innerText = sonSinav.yanlis;
        document.getElementById('dispBos').innerText = sonSinav.bos;
        document.getElementById('dispNet').innerText = sonSinav.net;

        document.getElementById('dispBasari').innerText = sonSinav.basari || "Değerlendirme yok.";
        document.getElementById('dispNot').innerText = sonSinav.not || "Not eklenmemiş.";

        // Konu Analizi Render
        if (sonSinav.konular && sonSinav.konular.length > 0) {
          let html = "";
          sonSinav.konular.forEach(k => {
            html += `
              <div class="topic-item">
                <div class="topic-header">
                  <span>${k.konu}</span>
                  <span>%${k.yuzde}</span>
                </div>
                <div class="bar-bg">
                  <div class="bar-fill" style="width: ${k.yuzde}%;"></div>
                </div>
              </div>
            `;
          });
          document.getElementById('dispKonular').innerHTML = html;
        } else {
          document.getElementById('dispKonular').innerHTML = "Konu analizi bulunamadı.";
        }

        // Geçmiş Sınavlar Listesi
        let gecmisHtml = "";
        data.forEach(s => {
          gecmisHtml += `
            <div class="history-item">
              <span>${s.sinav}</span>
              <span class="history-score">${s.net} Net</span>
            </div>
          `;
        });
        document.getElementById('dispGecmis').innerHTML = gecmisHtml;

        document.getElementById('karneContent').style.display = 'block';

      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        alert("Veriler çekilirken bir hata oluştu: " + err);
      }
    }
  </script>
</body>
</html>
